name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: browser-extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
          run_install: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the pinned Playwright runtime
        run: |
          node playwright/utils/generate_injected.js
          pnpm playwright:build
      - name: Install Chromium for extension integration tests
        run: pnpm --filter playwriter exec playwright-core install --with-deps chromium
      - name: Build Playwriter and the extension
        run: pnpm build
      - name: Run the Playwriter test suite
        run: pnpm test:ci
